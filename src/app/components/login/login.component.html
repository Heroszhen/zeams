<section id="login">
    <div class="wrap-card">
        <mat-card class="example-card" appearance="outlined">
            <mat-card-header class="text-center pb-3">
              <mat-card-title>ZEAMS</mat-card-title>
              <mat-card-subtitle>Connectez-vous</mat-card-subtitle>
            </mat-card-header>
            <img mat-card-image src="assets/photos/login.png">
            <mat-card-content class="pt-3">
                <form #loginForm="ngForm" (ngSubmit)="sendLogin()">
                    <mat-form-field class="w-100">
                        <mat-label>Mail</mat-label>
                        <input 
                            type="email" 
                            matInput 
                            id="email" 
                            name="email" 
                            required 
                            [(ngModel)]="loginM.email" 
                            #email="ngModel"
                            email
                        >
                        @if (email.invalid && (email.dirty || email.touched)) {
                            <mat-error>Erreur</mat-error>
                        }
                    </mat-form-field>
                    <mat-form-field class="w-100">
                        <mat-label>Mot de passe</mat-label>
                        <input 
                            [type]="hidden ? 'password' : 'text'"
                            matInput 
                            id="password" 
                            name="password" 
                            required 
                            [(ngModel)]="loginM.password" 
                            #password="ngModel"
                            password
                            minlength="5"
                            autocomplete="off"
                        >
                        <mat-icon matSuffix (click)="hidden = !hidden" role="button">{{hidden ? 'visibility_off' : 'visibility'}}</mat-icon>
                        @if (password.invalid && (password.dirty || password.touched)) {
                            <mat-error>Erreur</mat-error>
                        }
                    </mat-form-field>
                    <button mat-flat-button color="primary" type="submit" class="w-100 mt-2" [disabled]="loginForm.form.invalid">Connexion</button>
                </form>
            </mat-card-content>
          </mat-card>
    </div>
</section>
